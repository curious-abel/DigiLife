{%extends "base.html"%}

{%block content%}
{%for video in videos%}
<p>{{video.file_name}}</p>
<a href="{{video.download_url}}"><img src="/static/download.png" alt="download" width="30"></a>
<a href="{{video.cloudinary_url}}"><img src="/static/play.png" alt="" width="30px"></a>
<form style="display: inline;" method="POST" action="{{ url_for('delete_file', file_id=video.id) }}">
    <button class="delete-links" style="border-color: red;" type="submit"><img src="/static/delete.png" alt="" width="20px"></button>
</form>
{%endfor%}

{%endblock%}
