{%extends "base.html"%}

{%block content%}
<p>your pictures here</p>
{%for image in images%}
<p>{{image.file_name}}</p>
<a href="{{image.download_url}}"><img src="/static/download.png" alt="download" width="30"></a>
<a href="{{image.cloudinary_url}}"><img src="/static/open.png" alt="" width="30px"></a>
<form style="display: inline;" method="POST" action="{{ url_for('delete_file', file_id=image.id) }}">
    <button class="delete-links" style="border-color: red;" type="submit"><img src="/static/delete.png" alt="" width="20px"></button>
</form>
{%endfor%}

{%endblock%}
