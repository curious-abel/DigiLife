{%extends "base.html"%}

{%block content%}
<p>your documents here</p>
{%for document in documents%}
<p>{{document.file_name}}</p>
<a href="{{document.download_url}}"><img src="/static/download.png" alt="download" width="30"></a>
<a href="{{document.cloudinary_url}}"><img src="/static/open.png" alt="doc" width="30px"></a>
<form style="display: inline;" method="POST" action="{{ url_for('delete_file', file_id=document.id) }}">
    <button class="delete-links" style="border-color: red;" type="submit"><img src="/static/delete.png" alt="" width="20px"></button>
</form>
{%endfor%}



{%endblock%}
